name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Release Bundle (AAB) & APK
        run: |
          gradle :app:bundleRelease --no-daemon
          gradle :app:assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-toolkit-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-toolkit-release-aab
          path: app/build/outputs/bundle/release/*.aab
