name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Project Structure
        run: |
          echo "Repository root:"
          pwd
          echo "Files:"
          ls -la
          echo "Searching for gradlew:"
          find . -name gradlew -type f

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Enter Android Project
        run: |
          if [ -f "./AI-Trading-Toolkit/gradlew" ]; then
            echo "Android project found in AI-Trading-Toolkit/"
          elif [ -f "./gradlew" ]; then
            echo "Android project found in repository root"
          else
            echo "ERROR: gradlew was not found."
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

      - name: Configure Android Project
        run: |
          if [ -f "./AI-Trading-Toolkit/gradlew" ]; then
            cd AI-Trading-Toolkit
          fi

          chmod +x gradlew

          echo "Android project:"
          pwd
          echo "Gradle wrapper:"
          ls -la gradlew

      - name: Create Debug Keystore
        run: |
          if [ -f "./AI-Trading-Toolkit/gradlew" ]; then
            cd AI-Trading-Toolkit
          fi

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created:"
          ls -lh debug.keystore

      - name: Run Unit Tests
        working-directory: AI-Trading-Toolkit
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: AI-Trading-Toolkit
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build Release Bundle (AAB) & APK
        working-directory: AI-Trading-Toolkit
        run: |
          ./gradlew :app:bundleRelease --no-daemon
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-toolkit-debug-apk
          path: AI-Trading-Toolkit/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-toolkit-release-aab
          path: AI-Trading-Toolkit/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-trading-toolkit-release-apk
          path: AI-Trading-Toolkit/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
